name: Gerar APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar e Publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Injetar Versão Dinâmica via sed
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "Injetando versionCode: $VERSION_CODE e versionName:$VERSION_NAME"
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/g" app/build.gradle.kts || true
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION_NAME\"/g" app/build.gradle.kts || true

      - name: Garantir debug.keystore Permanente
        run: |
          mkdir -p app/keystore
          if [ ! -f app/keystore/debug.keystore ]; then
            echo "Criando debug.keystore permanente..."
            keytool -genkey -v -keystore app/keystore/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/keystore/debug.keystore
            git commit -m "ci: persistir debug.keystore permanente [skip ci]" || echo "Sem alterações"
            git push origin HEAD:${{ github.ref_name }} || echo "Push da keystore ignorado"
          else
            echo "debug.keystore já existe."
          fi

      - name: Dar Permissão de Execução ao Gradlew
        run: chmod +x gradlew

      - name: Compilar APK (Modo Headless)
        run: ./gradlew assembleDebug -Djava.awt.headless=true --stacktrace

      - name: Preparar Saída Limpa do APK
        run: |
          VERSION_TAG="v1.0.${{ github.run_number }}"
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/Switch-Craft-$VERSION_TAG.apk \;
          echo "APK gerado com sucesso:"
          ls -lh release-output/

      - name: Salvar Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Switch-Craft-v1.0.${{ github.run_number }}
          path: release-output/*.apk

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Switch-Craft v1.0.${{ github.run_number }}"
          body: |
            ### 🚀 Nova versão do Switch-Craft!
            - **Versão:** `1.0.${{ github.run_number }}`
            - **Commit:** ${{ github.sha }}
            - Compilado automaticamente via GitHub Actions.
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
